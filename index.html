<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Arbitraje</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #111;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #333; }
        .resultado {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            font-size: 14px;
        }
        .si-arbitraje { background-color: #e6f4ea; border-color: #34a853; color: #137333; }
        .no-arbitraje { background-color: #fce8e6; border-color: #ea4335; color: #c5221f; }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora Surebets</h2>
    
    <div class="form-group">
        <label>Cuota 1:</label>
        <input type="number" id="c1" step="0.01" placeholder="Ej: 2.10">
    </div>
    
    <div class="form-group">
        <label>Cuota 2:</label>
        <input type="number" id="c2" step="0.01" placeholder="Ej: 2.05">
    </div>
    
    <div class="form-group">
        <label>Monto Total a Apostar ($):</label>
        <input type="number" id="monto" step="0.01" placeholder="Ej: 100">
    </div>
    
    <button onclick="calcular()">CALCULADOR</button>
    
    <div id="resultado" class="resultado" style="display: none;"></div>
</div>

<script>
function calcular() {
    let c1 = parseFloat(document.getElementById('c1').value);
    let c2 = parseFloat(document.getElementById('c2').value);
    let monto = parseFloat(document.getElementById('monto').value);
    let resDiv = document.getElementById('resultado');

    if (!c1 || !c2 || !monto || c1 <= 1 || c2 <= 1 || monto <= 0) {
        resDiv.style.display = 'block';
        resDiv.className = 'resultado no-arbitraje';
        resDiv.innerHTML = "<b>Error:</b> Ingresa números válidos mayores a 1.";
        return;
    }

    let prob1 = (1 / c1) * 100;
    let prob2 = (1 / c2) * 100;
    let sumaTotal = prob1 + prob2;

    resDiv.style.display = 'block';

    if (sumaTotal < 100) {
        let apuesta1 = monto * (1 / c1) / (sumaTotal / 100);
        let apuesta2 = monto * (1 / c2) / (sumaTotal / 100);
        let retorno = apuesta1 * c1;
        let beneficio = retorno - monto;
        let rentabilidad = (beneficio / monto) * 100;

        resDiv.className = 'resultado si-arbitraje';
        resDiv.innerHTML = `<b>¡SÍ HAY ARBITRAJE!</b><br>` +
                           `Suma: ${sumaTotal.toFixed(2)}%<br><hr>` +
                           `• Apuesta Casa 1: $${apuesta1.toFixed(2)}<br>` +
                           `• Apuesta Casa 2: $${apuesta2.toFixed(2)}<br>` +
                           `• Beneficio Neto: $${beneficio.toFixed(2)} (${rentabilidad.toFixed(2)}%)`;
    } else {
        resDiv.className = 'resultado no-arbitraje';
        resDiv.innerHTML = `<b>NO HAY ARBITRAJE</b><br>` +
                           `La suma de probabilidades es ${sumaTotal.toFixed(2)}% (supera el 100%). La casa tiene la ventaja.`;
    }
}
</script>

</body>
</html>
